<div class="fd-content" *ngIf="!isLoading && file; else loadingOrError">
  <app-file-details-header
    [file]="file"
    [tabs]="tabs"
    [activeTab]="activeTab"
    (back)="goBack()"
    (preview)="previewFile()"
    (download)="downloadFile()"
    (tabChange)="setTab($event)"
  ></app-file-details-header>

  <!-- Overview -->
  @if (activeTab === 'overview') {
    <app-file-details-overview
      [file]="file"
      (download)="downloadFile()"
      (delete)="deleteFile()"
    ></app-file-details-overview>
  }

  <!-- Activity -->
  <!-- @if (activeTab === 'activity') {
    <app-file-details-activity
      [activity]="activity"
    ></app-file-details-activity>
  } -->

  <!-- Approval Progress -->
  @if (activeTab === 'approval') {
    <app-file-details-approval
      [approvalSteps]="approvalSteps"
      [isLoadingApprovals]="isLoadingApprovals"
    ></app-file-details-approval>
  }
</div>

<ng-template #loadingOrError>
  <div *ngIf="isLoading" class="state-msg">{{ 'FILE_DETAILS.LOADING' | translate }}</div>
  <div *ngIf="errorMessage" class="state-msg error">{{ errorMessage }}</div>
</ng-template>

<!-- Preview Modal -->
<div class="preview-overlay" *ngIf="showPreviewModal" (click)="closePreviewModal()">
  <div class="preview-modal" (click)="$event.stopPropagation()">
    <div class="preview-header">
      <span class="preview-title">{{ file?.name }}</span>
      <button class="preview-close-btn" (click)="closePreviewModal()">✕</button>
    </div>

    <div class="preview-body">
      <div class="preview-loading" *ngIf="isLoadingPreview">
        {{ 'FILES.PREVIEW_LOADING' | translate }}
      </div>

      <ng-container *ngIf="!isLoadingPreview">
        <img
          *ngIf="previewKind === 'image' && previewUrl"
          [src]="previewUrl"
          class="preview-image"
          alt="File preview"
        />

        <iframe
          *ngIf="previewKind === 'pdf' && previewUrl"
          [src]="previewUrl"
          class="preview-pdf"
        ></iframe>

        <pre *ngIf="previewKind === 'text'" class="preview-text">{{ previewText }}</pre>

        <div class="preview-unsupported" *ngIf="previewKind === 'unsupported'">
          <p>{{ 'FILES.PREVIEW_UNSUPPORTED' | translate }}</p>
          <button class="btn btn-outline" (click)="downloadFile()">
            {{ 'FILES.DOWNLOAD_INSTEAD' | translate }}
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
