<!-- forward-file-dialog.html -->
<div class="overlay" (click)="cancel()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h3>{{ 'FORWARD_DIALOG.TITLE' | translate }}</h3>
    <div class="user-list">
      @for (u of users; track u.u_id) {
        <label class="user-row">
          <input type="checkbox" [checked]="selectedIds.has(u.u_id)" (change)="toggleUser(u.u_id)" />
          {{ u.name }}
        </label>
      }
    </div>
    <textarea [(ngModel)]="message" [placeholder]="'FORWARD_DIALOG.OPTIONAL_MESSAGE' | translate"></textarea>
    <div class="actions">
      <button (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
      <button class="primary" [disabled]="submitting || selectedIds.size === 0" (click)="submit()">{{ 'FORWARD_DIALOG.SEND' | translate }}</button>
    </div>
  </div>
</div>
